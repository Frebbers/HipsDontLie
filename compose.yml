name: hipsdontlie
x-common-env: &app-env
  ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT}
  DOTNET_RUNNING_IN_CONTAINER: "true"
  JwtSettings__SecretKey: ${JWT_SECRET}
  JwtSettings__Issuer: "${JwtSettings__Issuer:-HipsDontLie}"
  JwtSettings__Audience: "${JwtSettings__Audience:-HipsDontLieApp}"
  ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection:-server=db;port=3306;database=hipsdontlie;user=test;password=rekt123}"
  MongoChat__ConnectionString: "${MongoChat__ConnectionString:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin}"
  MongoChat__DatabaseName: "${MongoChat__DatabaseName:-hips_chat}"
  MongoChat__MessagesCollectionName: "${MongoChat__MessagesCollectionName:-messages}"
  EmailSettings__VerificationUrl: ${EMAIL_VERIFICATION_URL}
  EmailSettings__SmtpServer: ${SMTP_SERVER}
  EmailSettings__Port: ${SMTP_PORT}
  EmailSettings__SenderEmail: ${SENDER_EMAIL}
  EmailSettings__SenderPassword: ${SENDER_PASSWORD}
services:

  # MySQL Database
  db:
    image: lscr.io/linuxserver/mariadb:11.4.8
    container_name: hipsdontlie-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 2
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network

  # Mongo Database
  mongodb:
    image: mongo:7.0
    container_name: hipsdontlie-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin"]
      interval: 5s
      timeout: 10s
      retries: 2
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - app-network

  # Migration service to run db migrations
  migrate:
    volumes: #get code from host to run migrations - won't work if built from remote
      - type: bind
        source: .
        target: /src
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment: # defaults for dev/testing; Production should supply via secrets/env file
      <<: *app-env
    working_dir: /src
    command: > 
      sh -c "dotnet ef database update --project HipsDontLie.Server/HipsDontLie.Server.csproj"
    profiles: ["migrate"]
    restart: "no"
    networks:
      - app-network

  test:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: hipsdontlie-tests
    working_dir: /src
    volumes:
      - ./:/src
      - ./test-results:/src/test-results
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"
    command: dotnet test --logger:"trx;LogFileName=test-results.trx" --results-directory:/src/test-results

  # nginx:
  #   image: nginx:alpine
  #   container_name: hipsdontlie-nginx
  #   depends_on:
  #     - hipsdontlie
  #   ports:
  #     - "8080:80"
  #     - "8443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   restart: unless-stopped
  #   networks:
  #     - app-network

volumes:
  db_data:
  mongo_data:

networks:
  app-network:
    driver: bridge

