name: Deploy Project
on: 
  push:
    branches: main
  pull_request:
    branches: main
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: HDL_AZURE
    steps:
#    - name: Set up SSL certificate
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.2.3
      with:
        host: ${{ vars.HDL_DOMAIN }}
        username: ${{ secrets.SSH_USER }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_KEY_PASS_PHRASE }}
        command_timeout: 2m
        script: |
          # Set error handling for atomicity
          set -e
          
          warn_if_empty() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "WARNING: Environment variable '$name' is not set or empty"
            fi
          }
          # Export environment variables for docker compose
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          
          # Email config
          export EMAIL_VERIFICATION_URL="${{ env.EMAIL_VERIFICATION_URL }}"
          export SMTP_SERVER="${{ env.SMTP_SERVER }}"
          export SMTP_PORT="${{ env.SMTP_PORT }}"
          export SENDER_EMAIL="${{ env.SMTP_SENDER_EMAIL }}"
          export SENDER_PASSWORD="${{ secrets.SENDER_PASSWORD }}"
          
          # Google auth config
          export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          export GOOGLE_SECRET="${{ secrets.GOOGLE_SECRET }}"
          export CERT_NOTIFICATION_EMAIL="${{ secrets.CERT_NOTIFICATION_EMAIL }}"
          
          # Database config
          export MYSQL_DATABASE_NAME="${{ env.MYSQL_DATABASE_NAME }}"
          export DB_PASSWORD="${{ secrets.MYSQL_DATABASE_PASSWORD }}"
          export DB_NAME="${{ secrets.MYSQL_DATABASE_NAME }}"
          export DB_USER="${{ env.MYSQL_DATABASE_USER_NAME }}"
          export DB_ROOT_PASSWORD="${{ secrets.DB_ROOT_PASSWORD }}"
          export DB_CONNECTION_STRING="server=db;port=3306;database=${DB_NAME};user=${DB_USER};password=${DB_PASSWORD};"
          
          
          # MongoDB config
          export MONGO_INITDB_ROOT_USERNAME="${{ secrets.MONGO_ROOT_USERNAME }}"
          export MONGO_INITDB_ROOT_PASSWORD="${{ secrets.MONGO_ROOT_PASSWORD }}"
          export MONGO_INITDB_DATABASE="${{ env.MONGO_DATABASE_NAME }}"
          export MongoChat__ConnectionString="${{ secrets.MongoChat__ConnectionString }}"
          export MONGO_DATABASE_USERNAME="${{ secrets.MONGO_DATABASE_USERNAME }}"
          export MONGO_DATABASE_PASSWORD="${{ secrets.MONGO_DATABASE_PASSWORD }}"

          cd $HOME
          
          # Warnings for missing values
          warn_if_empty "JWT_SECRET" "$JWT_SECRET"
          
          warn_if_empty "EMAIL_VERIFICATION_URL" "$EMAIL_VERIFICATION_URL"
          warn_if_empty "SMTP_SERVER" "$SMTP_SERVER"
          warn_if_empty "SMTP_PORT" "$SMTP_PORT"
          warn_if_empty "SENDER_EMAIL" "$SENDER_EMAIL"
          warn_if_empty "SENDER_PASSWORD" "$SENDER_PASSWORD"
          
          warn_if_empty "GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_ID"
          warn_if_empty "GOOGLE_SECRET" "$GOOGLE_SECRET"
          warn_if_empty "CERT_NOTIFICATION_EMAIL" "$CERT_NOTIFICATION_EMAIL"
          
          warn_if_empty "MYSQL_DATABASE_NAME" "$MYSQL_DATABASE_NAME"
          warn_if_empty "DB_PASSWORD" "$DB_PASSWORD"
          warn_if_empty "DB_NAME" "$DB_NAME"
          warn_if_empty "DB_USER" "$DB_USER"
          warn_if_empty "DB_ROOT_PASSWORD" "$DB_ROOT_PASSWORD"
          warn_if_empty "DB_CONNECTION_STRING" "$DB_CONNECTION_STRING"

          warn_if_empty "MONGO_INITDB_ROOT_USERNAME" "$MONGO_INITDB_ROOT_USERNAME"
          warn_if_empty "MONGO_INITDB_ROOT_PASSWORD" "$MONGO_INITDB_ROOT_PASSWORD"
          warn_if_empty "MONGO_INITDB_DATABASE" "$MONGO_INITDB_DATABASE"
          warn_if_empty "MongoChat__ConnectionString" "$MongoChat__ConnectionString"
          warn_if_empty "MONGO_DATABASE_USERNAME" "$MONGO_DATABASE_USERNAME"
          warn_if_empty "MONGO_DATABASE_PASSWORD" "$MONGO_DATABASE_PASSWORD"
          
          # Download the compose.prod.yaml file from the repository
          if ! curl -f -o compose.prod.yaml https://raw.githubusercontent.com/Frebbers/HipsDontLie/main/compose.prod.yaml; then
            echo "Error: Failed to download compose.prod.yaml"
            exit 1
          fi
          
          # Save current app container ID for rollback (if exists)
          OLD_CONTAINER_ID=$(docker ps -aq -f name=hipsdontlie-app) || true
          
          # Pull new images for the app service with error handling
          if ! docker compose -f compose.prod.yaml pull app; then
            echo "Error: Failed to pull new images"
            exit 1
          fi
          
          # Stop and remove the app container only
          docker compose -f compose.prod.yaml stop app || true
          docker compose -f compose.prod.yaml rm -f app || true
          
          # Start the app service with error handling and rollback on failure
          if ! docker compose -f compose.prod.yaml up -d; then
            echo "Error: Failed to start app container, attempting rollback"
            # Remove the failed container
            docker compose -f compose.prod.yaml rm -f app || true
            # Restart the old container if it existed
            if [ -n "$OLD_CONTAINER_ID" ]; then
              echo "Restarting previous app container"
              docker start "$OLD_CONTAINER_ID" || echo "Warning: Could not restart old container"
            fi
            exit 1
          fi
          
          # Clean up old container if deployment was successful
          if [ -n "$OLD_CONTAINER_ID" ]; then
            docker rm "$OLD_CONTAINER_ID" 2>/dev/null || true
          fi
          
          echo "Deployment successful"
        
