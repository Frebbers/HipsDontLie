name: Deploy Project
on: 
  push:
    branches: "main"
  pull_request:
    branches: "main"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DTU Hosting
    steps:
#    - name: Set up SSL certificate
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.8.1
      with:
        host: ${{ vars.HOST }}
        username: ${{ secrets.SSH_USER }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # Set error handling for atomicity
          set -e
          
          # Export environment variables for docker compose
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export MYSQL_DATABASE_NAME="${{ secrets.MYSQL_DATABASE_NAME }}"
          export MONGO_DATABASE_USERNAME="${{ secrets.MONGO_DATABASE_USERNAME }}"
          export MONGO_DATABASE_PASSWORD="${{ secrets.MONGO_DATABASE_PASSWORD }}"
          export EMAIL_VERIFICATION_URL="${{ secrets.EMAIL_VERIFICATION_URL }}"
          export SMTP_SERVER="${{ secrets.SMTP_SERVER }}"
          export SMTP_PORT="${{ secrets.SMTP_PORT }}"
          export SENDER_EMAIL="${{ secrets.SENDER_EMAIL }}"
          export SENDER_PASSWORD="${{ secrets.SENDER_PASSWORD }}"
          export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          export GOOGLE_SECRET="${{ secrets.GOOGLE_SECRET }}"
          export CERT_NOTIFICATION_EMAIL="${{ secrets.CERT_NOTIFICATION_EMAIL }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          export DB_NAME="${{ secrets.DB_NAME }}"
          export DB_USER="${{ secrets.DB_USER }}"
          export MONGO_INITDB_ROOT_USERNAME="${{ secrets.MONGO_INITDB_ROOT_USERNAME }}"
          export MONGO_INITDB_ROOT_PASSWORD="${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}"
          export MONGO_INITDB_DATABASE="${{ secrets.MONGO_INITDB_DATABASE }}"
          export ConnectionStrings__DefaultConnection="${{ secrets.ConnectionStrings__DefaultConnection }}"
          export MongoChat__ConnectionString="${{ secrets.MongoChat__ConnectionString }}"
          
          # Download the compose.prod.yaml file from the repository
          if ! curl -f -o compose.prod.yaml https://raw.githubusercontent.com/Frebbers/HipsDontLie/main/compose.prod.yaml; then
            echo "Error: Failed to download compose.prod.yaml"
            exit 1
          fi
          
          # Save current app container ID for rollback (if exists)
          OLD_CONTAINER_ID=$(docker ps -aq -f name=hipsdontlie-app) || true
          
          # Pull new images for the app service with error handling
          if ! docker compose -f compose.prod.yaml pull app; then
            echo "Error: Failed to pull new images"
            exit 1
          fi
          
          # Stop and remove the app container only
          docker compose -f compose.prod.yaml stop app || true
          docker compose -f compose.prod.yaml rm -f app || true
          
          # Start the app service with error handling and rollback on failure
          if ! docker compose -f compose.prod.yaml up -d app; then
            echo "Error: Failed to start app container, attempting rollback"
            # Remove the failed container
            docker compose -f compose.prod.yaml rm -f app || true
            # Restart the old container if it existed
            if [ -n "$OLD_CONTAINER_ID" ]; then
              echo "Restarting previous app container"
              docker start "$OLD_CONTAINER_ID" || echo "Warning: Could not restart old container"
            fi
            exit 1
          fi
          
          # Clean up old container if deployment was successful
          if [ -n "$OLD_CONTAINER_ID" ]; then
            docker rm "$OLD_CONTAINER_ID" 2>/dev/null || true
          fi
          
          echo "Deployment successful"
        
