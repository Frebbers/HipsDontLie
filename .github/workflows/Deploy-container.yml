name: Deploy Project
on: 
  pull_request:
    branches: "main"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DTU Hosting
    steps:
#    - name: Set up SSL certificate
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: ${{ vars.HOST }}
        username: ${{ secrets.SSH_USER }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # Create/overwrite .env file with all environment variables from GitHub Secrets
          cat > .env << 'EOF'
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MYSQL_DATABASE_NAME=${{ secrets.MYSQL_DATABASE_NAME }}
          MONGO_DATABASE_USERNAME=${{ secrets.MONGO_DATABASE_USERNAME }}
          MONGO_DATABASE_PASSWORD=${{ secrets.MONGO_DATABASE_PASSWORD }}
          EMAIL_VERIFICATION_URL=${{ secrets.EMAIL_VERIFICATION_URL }}
          SMTP_SERVER=${{ secrets.SMTP_SERVER }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD=${{ secrets.SENDER_PASSWORD }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET=${{ secrets.GOOGLE_SECRET }}
          CERT_NOTIFICATION_EMAIL=${{ secrets.CERT_NOTIFICATION_EMAIL }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          MONGO_INITDB_DATABASE=${{ secrets.MONGO_INITDB_DATABASE }}
          ConnectionStrings__DefaultConnection=${{ secrets.ConnectionStrings__DefaultConnection }}
          MongoChat__ConnectionString=${{ secrets.MongoChat__ConnectionString }}
          EOF
          
          # Download the compose.prod.yaml file from the repository
          curl -o compose.prod.yaml https://raw.githubusercontent.com/Frebbers/HipsDontLie/main/compose.prod.yaml
          
          # Stop and remove old containers
          docker compose -f compose.prod.yaml down
          
          # Pull new images
          docker compose -f compose.prod.yaml pull
          
          # Start the application
          docker compose -f compose.prod.yaml up -d
        
